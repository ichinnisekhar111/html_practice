<!doctype html>
<html>
    <head>
        <title>Student form</title>
    </head>

    <body> 
        <h1> Student Registration Form</h1>
        <form>
            <label for="student name">Student Name: </label>
            <input type="text" id="student name" name="Student Name"><br><br>

            <label for="email">Email :</label>
            <input type="email" id="email" name="email"><br><br>

            <label for="ps">Password : </label>
            <input type="password" id="ps" name="password"><br><br>

            <label for="dob">Date of Birth : </label>
            <input type="date" id="dob" name="dob"><br><br>

            <label for="age">Age : </label>
            <input type="number" id="age" name="age"><br><br>

            <label>Gender :</label>
            <input type="radio" id="male" name="gender" value="male">Male
            <input type="radio" id="female" name="gender" value="female">Female<br><br>

            <label for="checkbox"> Skills :</label>
            <input type="checkbox" id = "checkbox" name="checkbox"> Python
            <input type="checkbox" id = "checkbox" name="checkbox"> Java
            <input type="checkbox" id = "checkbox" name="checkbox"> DSA
            <input type="checkbox" id = "checkbox" name="checkbox"> SQL
            <input type="checkbox" id = "checkbox" name="checkbox"> HTML <br><br>

            <label for="Course">Course :</label>
            <select id="course" name="course">
            <option value="">-- Select Course --</option>
            <option value="python full stack"> Python Full Stack</option>
            <option value="java full stack"> Java Full Stack</option>
            <option value="data science"> Data Science</option>
            </select> <br><br>

            <label for="phone">Phone No : </label>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="photo">Student photo : </label>
            <input type="file" id="photo" name="photo"><br><br>

            <label for="address"> Address :</label>
            <textarea id="address" name="address" rows="3" cols="30"></textarea><br><br>

            <label for="study time"> Study time :</label>
            <input type ="time" id="study time" name="study time"><br><br>

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
    

        

        </form>
    </body>
</html>
